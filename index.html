<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Peperiksaan Penggal 1 (MEI) 2026 - SMK Selirik</title>
    <style>
        :root {
            --primary-night-blue: #151B54;
            --soft-blue-grad: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%);
            --card-bg: #ffffff;
            --text-dark: #333333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: var(--soft-blue-grad);
            min-height: 100vh;
            color: var(--text-dark);
        }

        /* HEADER */
        .portal-header {
            background-color: var(--primary-night-blue);
            background-image: url('https://www.transparenttextures.com/patterns/cubes.png'); /* Abstract elegant pattern */
            color: white;
            text-align: center;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .portal-header img {
            max-width: 120px;
            margin-bottom: 10px;
        }

        .portal-header h1 { font-size: 1.5rem; margin-bottom: 5px; }
        .portal-header h2 { font-size: 1.2rem; font-weight: normal; }

        /* CONTAINERS */
        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 15px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.08);
            margin-bottom: 20px;
        }

        /* LOGIN FORM */
        #login-section {
            max-width: 400px;
            margin: 50px auto;
            text-align: center;
        }
        
        .form-group { margin-bottom: 15px; text-align: left; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
        .form-group input, .form-group select {
            width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px; font-size: 1rem;
        }

        .btn {
            background-color: var(--primary-night-blue);
            color: white; border: none; padding: 12px 20px; width: 100%;
            border-radius: 8px; font-size: 1rem; cursor: pointer; transition: 0.3s;
        }
        .btn:hover { opacity: 0.9; }

        /* DASHBOARD */
        #dashboard-section { display: none; }
        .controls { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; align-items: center; justify-content: space-between; }
        .controls select { padding: 10px; border-radius: 8px; width: auto; min-width: 200px; }
        
        /* ANALYTICS */
        .analytics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .stat-box { background: #f8f9fa; padding: 15px; border-radius: 10px; text-align: center; border-left: 4px solid var(--primary-night-blue); }
        .stat-box h3 { font-size: 2rem; color: var(--primary-night-blue); }

        /* TABLE */
        .table-responsive { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.85rem; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: center; }
        th { background-color: var(--primary-night-blue); color: white; }

        /* SLIP KEPUTUSAN */
        #slips-container { display: none; }
        .slip-card {
            background: white; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            margin-bottom: 40px; padding: 30px; position: relative; overflow: hidden;
        }
        .slip-header-img { width: 100%; height: auto; border-radius: 10px 10px 0 0; margin-bottom: 20px; }
        .slip-info { display: flex; justify-content: space-between; margin-bottom: 20px; font-weight: bold; font-size: 0.95rem; }
        
        .signature-area { display: flex; justify-content: space-between; margin-top: 50px; text-align: center; font-weight: bold; }
        .sig-line { width: 200px; border-top: 1px solid black; margin-bottom: 5px; margin-left: auto; margin-right: auto; }

        /* FOOTER */
        footer { text-align: center; padding: 20px; font-size: 0.9rem; margin-top: 50px; color: #555; }

        /* PRINT STYLES */
        @media print {
            body { background: white; margin: 0; padding: 0; }
            .no-print, .portal-header, footer { display: none !important; }
            .container { width: 100%; margin: 0; padding: 0; max-width: 100%; }
            .card { box-shadow: none; border: none; padding: 0; margin: 0; }
            
            /* Pukal / Single Slip Format */
            .slip-card { 
                box-shadow: none; border: none; margin: 0; padding: 0; 
                page-break-after: always; /* Ensure NOT in continuous form */
            }
            .slip-card:last-child { page-break-after: auto; }

            /* Table format (Landscape) */
            .print-landscape {
                @page { size: landscape; }
                font-size: 8pt;
            }
            .print-landscape table th, .print-landscape table td { padding: 4px; }
        }
    </style>
</head>
<body>

    <header class="portal-header">
        <img src="https://i.ibb.co/VYSKMXf1/Logo-Selirik.png" alt="Logo SMK Selirik">
        <h1>SMK SELIRIK, KAPIT</h1>
        <h2>PORTAL PEPERIKSAAN PENGGAL 1 (MEI) 2026</h2>
    </header>

    <div class="container">
        <!-- LOGIN SECTION -->
        <div id="login-section" class="card">
            <h2>Log Masuk Guru Kelas</h2>
            <br>
            <div class="form-group">
                <label>ID Pengguna</label>
                <input type="text" id="login-id" placeholder="Masukkan ID">
            </div>
            <div class="form-group">
                <label>Kata Laluan</label>
                <input type="password" id="login-pwd" placeholder="Masukkan Kata Laluan">
            </div>
            <p id="login-err" style="color:red; display:none; margin-bottom:10px;">ID atau Kata Laluan Salah!</p>
            <button class="btn" onclick="login()">Log Masuk</button>
        </div>

        <!-- DASHBOARD SECTION -->
        <div id="dashboard-section">
            <div class="card no-print">
                <div class="controls">
                    <div>
                        <select id="tingkatan-select" onchange="fetchData()">
                            <option value="">-- Pilih Tingkatan --</option>
                            <option value="T1">Tingkatan 1</option>
                            <option value="T2">Tingkatan 2</option>
                            <option value="T3">Tingkatan 3</option>
                            <option value="T4">Tingkatan 4</option>
                            <option value="T5">Tingkatan 5</option>
                        </select>
                        <select id="kelas-select" onchange="filterKelas()" style="display:none;">
                            <option value="">-- Pilih Kelas --</option>
                        </select>
                    </div>
                    <div id="action-btns" style="display:none;">
                        <button class="btn" style="width:auto; background:#28a745;" onclick="printTable()">🖨️ Cetak Keseluruhan Kelas</button>
                        <button class="btn" style="width:auto; background:#17a2b8;" onclick="printSlips()">🖨️ Cetak Slip Pukal</button>
                    </div>
                </div>
            </div>

            <!-- ANALYTICS -->
            <div id="analytics-section" style="display:none;" class="no-print">
                <h3 style="margin-bottom: 10px; color: var(--primary-night-blue);">Analisis Kelas</h3>
                <div class="analytics-grid">
                    <div class="stat-box">
                        <div style="font-weight:bold;">Jumlah Pelajar</div>
                        <h3 id="stat-total">0</h3>
                    </div>
                    <div class="stat-box">
                        <div style="font-weight:bold;">Purata GP Kelas</div>
                        <h3 id="stat-gp">0.00</h3>
                    </div>
                </div>
            </div>

            <!-- CLASS TABLE (LANDSCAPE PRINT TARGET) -->
            <div id="table-container" class="card" style="display:none;">
                <h3 style="text-align: center; margin-bottom: 15px;" id="table-title"></h3>
                <div class="table-responsive" id="table-wrapper">
                    <!-- Table generated by JS -->
                </div>
            </div>

            <!-- INDIVIDUAL SLIPS (PORTRAIT PRINT TARGET) -->
            <div id="slips-container">
                <!-- Slips generated by JS -->
            </div>
        </div>
    </div>

    <footer>
        Hakcipta terpelihara NDJE@Selirik, Kapit 2026
    </footer>

    <script>
        const urls = {
            T1: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vR_cVUYiV59wBBM78IF0OeqL90DIeQXksU-sqQRnMF0Ou6_AFUSmyrf4mIvtZw5M2ROix6tooZwBp2m/pub?gid=1419213935&single=true&output=csv',
            T2: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vT52bai_YQO69Xj44RZ774cYQxkcAVSI32loOIrmSxl94gWaQA3zmuhjM24cvGQP4tin618SFxlhGmG/pub?gid=1419213935&single=true&output=csv',
            T3: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQLkEtjpu5SZcccaXkOlDMHHIsfPhIVNh4zlZmJgyRe93ND0Qk07YpzmE8GHuNzALyX7J1Rj2ye1NO5/pub?gid=1419213935&single=true&output=csv',
            T4: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQNF2kkoq_gq_9UFRWFWLosn8lQtbDf6bcP_zeSyEYwB_sQLSFGVZUdPRSq-ff6Nbx6Fgo3KbqM1MNW/pub?gid=1615224868&single=true&output=csv',
            T5: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQhqsBRMjA8LPYWT1V301p2vYO-8tVEbv1RSkSOyixoS-48cQpfUZTozkHqJgBSjUfBUIE7SgUMc2-K/pub?gid=1615224868&single=true&output=csv'
        };

        let rawData = [];
        let currentLevel = '';
        let currentClass = '';

        // LOGIN FUNCTION
        function login() {
            const id = document.getElementById('login-id').value;
            const pwd = document.getElementById('login-pwd').value;
            if (id === 'GT2026' && pwd === 'SAPSMAY2026') {
                document.getElementById('login-section').style.display = 'none';
                document.getElementById('dashboard-section').style.display = 'block';
            } else {
                document.getElementById('login-err').style.display = 'block';
            }
        }

        // FETCH CSV DATA
        async function fetchData() {
            const select = document.getElementById('tingkatan-select');
            currentLevel = select.value;
            document.getElementById('kelas-select').style.display = 'none';
            document.getElementById('action-btns').style.display = 'none';
            document.getElementById('table-container').style.display = 'none';
            document.getElementById('slips-container').style.display = 'none';
            document.getElementById('analytics-section').style.display = 'none';
            
            if (!currentLevel) return;

            try {
                // Fetching CSV
                const response = await fetch(urls[currentLevel]);
                const csvText = await response.text();
                parseCSV(csvText);
            } catch (error) {
                alert("Ralat mengambil pangkalan data. Sila pastikan pautan sah dan internet stabil.");
            }
        }

        // PARSE CSV (Handles basic quoted commas)
        function parseCSV(str) {
            let lines = str.split('\n');
            let result = [];
            for(let i=0; i<lines.length; i++){
                // Simple regex to split by comma outside quotes
                let row = lines[i].match(/(".*?"|[^",\s]+)(?=\s*,|\s*$)/g) || lines[i].split(',');
                // clean quotes
                row = row.map(item => item.replace(/^"|"$/g, '').trim());
                if(row.length > 5) { // Ensure row has valid data
                    result.push(row);
                }
            }
            rawData = result.slice(1); // skip header row assuming row 0 is header
            populateKelasDropdown();
        }

        function populateKelasDropdown() {
            const classSelect = document.getElementById('kelas-select');
            classSelect.innerHTML = '<option value="">-- Pilih Kelas --</option>';
            
            let classes = new Set();
            rawData.forEach(row => {
                if(row[3]) classes.add(row[3].toUpperCase()); // Col D is index 3
            });

            Array.from(classes).sort().forEach(cls => {
                let opt = document.createElement('option');
                opt.value = cls;
                opt.textContent = cls;
                classSelect.appendChild(opt);
            });
            classSelect.style.display = 'inline-block';
        }

        // Mapping subjek based on F1-3 and F4-5 specs
        function getSubjectsMapping(isUpper) {
            if(isUpper) {
                return [
                    { name: 'BAHASA MELAYU', short: 'BM', m: 4, g: 5 },
                    { name: 'SEJARAH', short: 'SEJ', m: 6, g: 7 },
                    { name: 'ENGLISH LANGUAGE', short: 'ENG', m: 8, g: 9 },
                    { name: 'MATEMATIK', short: 'MATHS', m: 10, g: 11 },
                    { name: 'PENDIDIKAN MORAL', short: 'PM', m: 12, g: 13 },
                    { name: 'PENDIDIKAN ISLAM', short: 'PI', m: 14, g: 15 },
                    { name: 'SAINS', short: 'SN', m: 16, g: 17 },
                    { name: 'PENDIDIKAN SENI VISUAL', short: 'PSV', m: 18, g: 19 },
                    { name: 'BAHASA IBAN', short: 'BIB', m: 20, g: 21 },
                    { name: 'REKA CIPTA', short: 'RC', m: 22, g: 23 },
                    { name: 'PENGAJIAN PERNIAGAAN', short: 'PP', m: 24, g: 25 },
                    { name: 'PHYSICS', short: 'FIZ', m: 26, g: 27 },
                    { name: 'CHEMISTRY', short: 'KIM', m: 28, g: 29 },
                    { name: 'BIOLOGY', short: 'BIO', m: 30, g: 31 },
                    { name: 'ADDITIONAL MATHEMATICS', short: 'ADD MATHS', m: 32, g: 33 },
                    { name: 'SAINS KOMPUTER', short: 'SK', m: 34, g: 35 },
                    { name: 'KIMPALAN ARKA & GAS', short: 'KAG', m: 36, g: 37 },
                    { name: 'PEND. JASMANI & KESIHATAN', short: 'PJPK', m: 62, g: 63 }
                ];
            } else {
                return [
                    { name: 'BAHASA MELAYU', short: 'BM', m: 4, g: 5 },
                    { name: 'ENGLISH LANGUAGE', short: 'ENG', m: 6, g: 7 },
                    { name: 'MATEMATIK', short: 'MATHS', m: 8, g: 9 },
                    { name: 'SEJARAH', short: 'SEJ', m: 10, g: 11 },
                    { name: 'SAINS', short: 'SN', m: 12, g: 13 },
                    { name: 'GEOGRAFI', short: 'GEO', m: 14, g: 15 },
                    { name: 'BAHASA IBAN', short: 'BIB', m: 16, g: 17 },
                    { name: 'PENDIDIKAN MORAL', short: 'PM', m: 18, g: 19 },
                    { name: 'PENDIDIKAN ISLAM', short: 'PI', m: 20, g: 21 },
                    { name: 'REKA BENTUK & TEKNOLOGI', short: 'RBT', m: 22, g: 23 },
                    { name: 'ASAS SAINS KOMPUTER', short: 'ASK', m: 24, g: 25 },
                    { name: 'PENDIDIKAN SENI VISUAL', short: 'PSV', m: 26, g: 27 },
                    { name: 'PEND. JASMANI & KESIHATAN', short: 'PJPK', m: 40, g: 41 }
                ];
            }
        }

        // Summary indices mappings
        function getSummaryMapping(isUpper) {
            if(isUpper) {
                return { jum: 78, purata: 79, gp: 80, analisis: 83, kept: 81, kdk: 82, kdt: 100, ulasan: 99, guru: 101 };
            } else {
                return { jum: 54, purata: 55, gp: 56, analisis: 59, kept: 57, kdk: 58, kdt: 69, ulasan: 60, guru: 70 };
            }
        }

        function filterKelas() {
            currentClass = document.getElementById('kelas-select').value;
            if(!currentClass) return;

            document.getElementById('action-btns').style.display = 'flex';
            document.getElementById('analytics-section').style.display = 'block';
            document.getElementById('table-container').style.display = 'block';

            let classData = rawData.filter(row => row[3] && row[3].toUpperCase() === currentClass);
            let isUpper = (currentLevel === 'T4' || currentLevel === 'T5');
            
            buildTable(classData, isUpper);
            buildSlips(classData, isUpper);
            updateAnalytics(classData, isUpper);
        }

        function isValidData(val) {
            return val !== undefined && val !== '' && val.toUpperCase() !== 'NULL';
        }

        function buildTable(data, isUpper) {
            let mapping = getSubjectsMapping(isUpper);
            let summary = getSummaryMapping(isUpper);
            let wrapper = document.getElementById('table-wrapper');
            let tableTitle = document.getElementById('table-title');
            
            tableTitle.innerText = `Rekod Keputusan Keseluruhan - Kelas ${currentClass}`;
            
            // Find which subjects actually have data in this class
            let activeSubjects = mapping.filter(sub => {
                return data.some(row => isValidData(row[sub.m]));
            });

            let html = `<table class="print-landscape">
                <thead>
                    <tr>
                        <th>Bil</th>
                        <th>Nama Pelajar</th>
                        ${activeSubjects.map(sub => `<th>${sub.short}</th>`).join('')}
                        <th>JUM</th>
                        <th>PURATA</th>
                        <th>GP</th>
                        <th>KDK</th>
                        <th>KDT</th>
                        <th>KEPUTUSAN</th>
                    </tr>
                </thead>
                <tbody>`;

            data.forEach((row, idx) => {
                let name = row[2] || '';
                let tr = `<tr>
                    <td>${idx + 1}</td>
                    <td style="text-align:left;">${name}</td>`;
                
                activeSubjects.forEach(sub => {
                    let mark = isValidData(row[sub.m]) ? row[sub.m] : '-';
                    let grade = isValidData(row[sub.g]) ? row[sub.g] : '-';
                    tr += `<td>${mark}<br><b>${grade}</b></td>`;
                });

                // total total class in form logic: format like x/253 (assuming CW is just X, append total)
                let kdtVal = row[summary.kdt] || '-';

                tr += `
                    <td>${row[summary.jum] || '-'}</td>
                    <td>${row[summary.purata] || '-'}</td>
                    <td>${row[summary.gp] || '-'}</td>
                    <td>${row[summary.kdk] || '-'}</td>
                    <td>${kdtVal}</td>
                    <td>${row[summary.kept] || '-'}</td>
                </tr>`;
                html += tr;
            });

            html += `</tbody></table>`;
            wrapper.innerHTML = html;
        }

        function buildSlips(data, isUpper) {
            let mapping = getSubjectsMapping(isUpper);
            let summary = getSummaryMapping(isUpper);
            let container = document.getElementById('slips-container');
            container.innerHTML = '';

            data.forEach(row => {
                // Determine active subjects for this specific student
                let studentSubjects = mapping.filter(sub => isValidData(row[sub.m]));
                
                let html = `
                <div class="slip-card">
                    <img src="https://i.ibb.co/9mL8CNMW/header-SLIP-KEPUTUSAN-PEPERIKSAAN.png" class="slip-header-img" alt="Header Slip">
                    
                    <div class="slip-info">
                        <div>NAMA : ${row[2]}</div>
                        <div>KELAS : ${row[3]}</div>
                    </div>

                    <table>
                        <thead>
                            <tr>
                                <th style="text-align:left;">MATA PELAJARAN</th>
                                <th>MARKAH</th>
                                <th>GRED</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${studentSubjects.map(sub => `
                                <tr>
                                    <td style="text-align:left;">${sub.name}</td>
                                    <td>${row[sub.m]}</td>
                                    <td>${row[sub.g]}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>

                    <div style="margin-top: 20px;">
                        <table style="width:50%; border:none; text-align:left;">
                            <tr style="border:none;"><td style="border:none; padding:3px; font-weight:bold;">JUMLAH MARKAH</td><td style="border:none; padding:3px;">: ${row[summary.jum] || '-'}</td></tr>
                            <tr style="border:none;"><td style="border:none; padding:3px; font-weight:bold;">PURATA</td><td style="border:none; padding:3px;">: ${row[summary.purata] || '-'}</td></tr>
                            <tr style="border:none;"><td style="border:none; padding:3px; font-weight:bold;">GRED PURATA</td><td style="border:none; padding:3px;">: ${row[summary.gp] || '-'}</td></tr>
                            <tr style="border:none;"><td style="border:none; padding:3px; font-weight:bold;">KEDUDUKAN KELAS</td><td style="border:none; padding:3px;">: ${row[summary.kdk] || '-'}</td></tr>
                            <tr style="border:none;"><td style="border:none; padding:3px; font-weight:bold;">KEDUDUKAN TINGKATAN</td><td style="border:none; padding:3px;">: ${row[summary.kdt] || '-'}</td></tr>
                            <tr style="border:none;"><td style="border:none; padding:3px; font-weight:bold;">KEPUTUSAN</td><td style="border:none; padding:3px;">: ${row[summary.kept] || '-'}</td></tr>
                            <tr style="border:none;"><td style="border:none; padding:3px; font-weight:bold;">ULASAN GURU</td><td style="border:none; padding:3px;">: ${row[summary.ulasan] || '-'}</td></tr>
                        </table>
                    </div>

                    <div class="signature-area">
                        <div>
                            <div class="sig-line"></div>
                            AWIN ANAK ENGGA<br>PENGETUA<br>SMK SELIRIK
                        </div>
                        <div>
                            <div class="sig-line"></div>
                            ${row[summary.guru] || 'GURU TINGKATAN'}<br>GURU TINGKATAN ${row[3]}<br>SMK SELIRIK
                        </div>
                    </div>
                </div>`;
                container.innerHTML += html;
            });
        }

        function updateAnalytics(data, isUpper) {
            let summary = getSummaryMapping(isUpper);
            document.getElementById('stat-total').innerText = data.length;
            
            let totalGP = 0;
            let validGPCount = 0;
            data.forEach(row => {
                let gp = parseFloat(row[summary.gp]);
                if(!isNaN(gp)) {
                    totalGP += gp;
                    validGPCount++;
                }
            });
            
            let avgGP = validGPCount > 0 ? (totalGP / validGPCount).toFixed(2) : "0.00";
            document.getElementById('stat-gp').innerText = avgGP;
        }

        // PRINT FUNCTIONS
        function printTable() {
            document.getElementById('table-container').style.display = 'block';
            document.getElementById('slips-container').style.display = 'none';
            // Menambah class untuk jadikan dia landscape waktu di print
            document.body.classList.add('print-landscape');
            window.print();
            document.body.classList.remove('print-landscape');
        }

        function printSlips() {
            document.getElementById('table-container').style.display = 'none';
            document.getElementById('slips-container').style.display = 'block';
            window.print();
            // Restore view
            document.getElementById('table-container').style.display = 'block';
            document.getElementById('slips-container').style.display = 'none';
        }
    </script>
</body>
</html>
