<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Peperiksaan Penggal 1 (MEI) 2026</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        :root {
            --night-blue: #151B54;
            --soft-blue-1: #e0eafc;
            --soft-blue-2: #cfdef3;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, var(--soft-blue-1), var(--soft-blue-2));
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header {
            background-color: var(--night-blue);
            color: white;
            padding: 20px;
            text-align: center;
            background-image: repeating-linear-gradient(45deg, rgba(255,255,255,0.05) 0px, rgba(255,255,255,0.05) 2px, transparent 2px, transparent 4px);
            position: relative;
        }
        header img {
            height: 80px;
            margin-bottom: 10px;
        }
        header h1 {
            margin: 5px 0;
            font-size: 24px;
        }
        header h2 {
            margin: 0;
            font-size: 16px;
            font-weight: 300;
        }
        .container {
            flex: 1;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
            box-sizing: border-box;
        }
        footer {
            background-color: var(--night-blue);
            color: white;
            text-align: center;
            padding: 15px;
            font-size: 14px;
        }
        .card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            padding: 20px;
            margin-bottom: 20px;
        }
        .login-container {
            max-width: 400px;
            margin: 50px auto;
            text-align: center;
        }
        input[type="text"], input[type="password"], select {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
        }
        button {
            background-color: var(--night-blue);
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
            margin-top: 10px;
        }
        button:hover {
            opacity: 0.9;
        }
        .dashboard { display: none; }
        
        /* Table Styles */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            font-size: 14px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: center;
        }
        th { background-color: var(--night-blue); color: white; }
        
        .student-card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 30px;
            overflow: hidden;
            border: 1px solid #eee;
        }
        .student-header {
            background: #f8f9fa;
            padding: 15px;
            border-bottom: 2px solid var(--night-blue);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .slip-header-img {
            width: 100%;
            display: block;
        }
        
        .print-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .print-buttons button { width: auto; flex: 1; min-width: 200px; }
        
        .signatures {
            display: flex;
            justify-content: space-between;
            margin-top: 40px;
            padding: 0 20px 20px;
        }
        .sig-block {
            text-align: center;
            width: 40%;
        }
        .sig-line {
            border-top: 1px solid black;
            margin-top: 50px;
            padding-top: 5px;
            font-weight: bold;
        }

        /* Print Styles */
        @media print {
            body { background: white !important; }
            header, footer, .print-buttons, #class-selector-card { display: none !important; }
            .container { padding: 0; max-width: none; }
            .card { box-shadow: none; border: none; padding: 0; margin: 0; }
            
            body.print-overview @page { size: landscape; margin: 10mm; }
            body.print-overview .student-card { display: none !important; }
            body.print-overview #overview-card { display: block !important; }
            
            body.print-individual @page { size: portrait; margin: 10mm; }
            body.print-individual #overview-card { display: none !important; }
            body.print-individual .student-card { 
                page-break-after: always; 
                box-shadow: none; 
                border: none; 
                margin-bottom: 0;
            }
        }
        
        #loading { display: none; text-align: center; padding: 20px; font-weight: bold; }
    </style>
</head>
<body>

<header>
    <img src="https://i.ibb.co/VYSKMXf1/Logo-Selirik.png" alt="Logo SMK Selirik">
    <h1>SMK SELIRIK, KAPIT</h1>
    <h2>Portal Peperiksaan Penggal 1 (MEI) Tahun 2026</h2>
</header>

<div class="container">
    <!-- Login Section -->
    <div id="login-section" class="card login-container">
        <h3>Log Masuk Guru Kelas</h3>
        <input type="text" id="userid" placeholder="ID Pengguna" value="GT2026">
        <input type="password" id="password" placeholder="Kata Laluan">
        <button onclick="login()">Log Masuk</button>
        <p id="login-error" style="color:red; display:none;">ID atau Kata Laluan salah!</p>
    </div>

    <div id="loading">Memuat turun data peperiksaan... Sila tunggu...</div>

    <!-- Dashboard Section -->
    <div id="dashboard-section" class="dashboard">
        <div class="card" id="class-selector-card">
            <h3>Pilih Kelas Anda</h3>
            <select id="class-select" onchange="loadClassData()">
                <option value="">-- Pilih Kelas --</option>
            </select>
            
            <div class="print-buttons" style="display:none;" id="print-controls">
                <button onclick="printOverview()">Cetak Keseluruhan Kelas</button>
                <button onclick="printSlips()">Cetak Pukal Slip</button>
            </div>
        </div>

        <div id="overview-card" class="card" style="display:none;">
            <h3 style="text-align:center;">Rekod Keputusan Keseluruhan Kelas</h3>
            <div id="overview-table-container" style="overflow-x: auto;"></div>
        </div>

        <div id="students-container"></div>
    </div>
</div>

<footer>
    &copy; Hakcipta NDJE@Selirik, Kapit 2026
</footer>

<script>
    const urls = [
        "https://docs.google.com/spreadsheets/d/e/2PACX-1vR_cVUYiV59wBBM78IF0OeqL90DIeQXksU-sqQRnMF0Ou6_AFUSmyrf4mIvtZw5M2ROix6tooZwBp2m/pub?gid=1419213935&single=true&output=csv", // T1
        "https://docs.google.com/spreadsheets/d/e/2PACX-1vT52bai_YQO69Xj44RZ774cYQxkcAVSI32loOIrmSxl94gWaQA3zmuhjM24cvGQP4tin618SFxlhGmG/pub?gid=1419213935&single=true&output=csv", // T2
        "https://docs.google.com/spreadsheets/d/e/2PACX-1vQLkEtjpu5SZcccaXkOlDMHHIsfPhIVNh4zlZmJgyRe93ND0Qk07YpzmE8GHuNzALyX7J1Rj2ye1NO5/pub?gid=1419213935&single=true&output=csv", // T3
        "https://docs.google.com/spreadsheets/d/e/2PACX-1vQNF2kkoq_gq_9UFRWFWLosn8lQtbDf6bcP_zeSyEYwB_sQLSFGVZUdPRSq-ff6Nbx6Fgo3KbqM1MNW/pub?gid=1615224868&single=true&output=csv", // T4
        "https://docs.google.com/spreadsheets/d/e/2PACX-1vQhqsBRMjA8LPYWT1V301p2vYO-8tVEbv1RSkSOyixoS-48cQpfUZTozkHqJgBSjUfBUIE7SgUMc2-K/pub?gid=1615224868&single=true&output=csv"  // T5
    ];

    let allData = [];
    let classesList = new Set();
    
    // Column Mappings
    const mapUpper = {
        subjects: [
            { name: "BAHASA MELAYU", abbr: "BM", m: 4, g: 5 },
            { name: "SEJARAH", abbr: "SEJ", m: 6, g: 7 },
            { name: "ENGLISH LANGUAGE", abbr: "ENG", m: 8, g: 9 },
            { name: "MATEMATIK/MATHEMATICS", abbr: "MATHS", m: 10, g: 11 },
            { name: "PENDIDIKAN MORAL", abbr: "PM", m: 12, g: 13 },
            { name: "PENDIDIKAN ISLAM", abbr: "PI", m: 14, g: 15 },
            { name: "SAINS", abbr: "SN", m: 16, g: 17 },
            { name: "PENDIDIKAN SENI VISUAL", abbr: "PSV", m: 18, g: 19 },
            { name: "BAHASA IBAN", abbr: "BIB", m: 20, g: 21 },
            { name: "REKA CIPTA", abbr: "RC", m: 22, g: 23 },
            { name: "PENGAJIAN PENIAGAAN", abbr: "PP", m: 24, g: 25 },
            { name: "PHYSICS", abbr: "FIZ", m: 26, g: 27 },
            { name: "CHEMISTRY", abbr: "KIM", m: 28, g: 29 },
            { name: "BIOLOGY", abbr: "BIO", m: 30, g: 31 },
            { name: "ADDITIONAL MATHEMATICS", abbr: "ADD MATHS", m: 32, g: 33 },
            { name: "SAINS KOMPUTER", abbr: "SK", m: 34, g: 35 },
            { name: "KIMPALAN ARKA & GAS", abbr: "KAG", m: 36, g: 37 },
            { name: "PENDIDIKAN JASMANI & PENDIDIKAN KESIHATAN", abbr: "PJPK", m: 62, g: 63 }
        ],
        jum: 78, purata: 79, gp: 80, keputusan: 81, kdk: 82, analisis: 83, 
        ulasan: 99, kdt: 100, guru: 101
    };

    const mapLower = {
        subjects: [
            { name: "BAHASA MELAYU", abbr: "BM", m: 4, g: 5 },
            { name: "ENGLISH LANGUAGE", abbr: "ENG", m: 6, g: 7 },
            { name: "MATEMATIK", abbr: "MATHS", m: 8, g: 9 },
            { name: "SEJARAH", abbr: "SEJ", m: 10, g: 11 },
            { name: "SAINS", abbr: "SN", m: 12, g: 13 },
            { name: "GEOGRAFI", abbr: "GEO", m: 14, g: 15 },
            { name: "BAHASA IBAN", abbr: "BIB", m: 16, g: 17 },
            { name: "PENDIDIKAN MORAL", abbr: "PM", m: 18, g: 19 },
            { name: "PENDIDIKAN ISLAM", abbr: "PI", m: 20, g: 21 },
            { name: "REKA BENTUK & TEKNOLOGI", abbr: "RBT", m: 22, g: 23 },
            { name: "ASAS SAINS KOMPUTER", abbr: "ASK", m: 24, g: 25 },
            { name: "PENDIDIKAN SENI VISUAL", abbr: "PSV", m: 26, g: 27 },
            { name: "PENDIDIKAN JASAMANI & PENDIDIKAN KESIHATAN", abbr: "PJPK", m: 40, g: 41 }
        ],
        jum: 54, purata: 55, gp: 56, keputusan: 57, kdk: 58, analisis: 59, 
        ulasan: 60, kdt: 69, guru: 70
    };

    function login() {
        const id = document.getElementById("userid").value;
        const pass = document.getElementById("password").value;
        if (id === "GT2026" && pass === "SAPSMAY2026") {
            document.getElementById("login-section").style.display = "none";
            document.getElementById("loading").style.display = "block";
            fetchData();
        } else {
            document.getElementById("login-error").style.display = "block";
        }
    }

    async function fetchData() {
        allData = [];
        for (let i = 0; i < urls.length; i++) {
            try {
                const response = await fetch(urls[i]);
                const csv = await response.text();
                const parsed = Papa.parse(csv, { skipEmptyLines: true }).data;
                // Add form identifier based on index
                const formLvl = (i < 3) ? 'rendah' : 'atas';
                parsed.forEach(row => {
                    if (row.length > 5) {
                        row.push(formLvl); // Append form level at end of row
                        allData.push(row);
                        if(row[3] && row[3].trim() !== "" && row[3].trim().toUpperCase() !== "KELAS") {
                            classesList.add(row[3].trim());
                        }
                    }
                });
            } catch (err) {
                console.error("Error fetching", urls[i], err);
            }
        }
        
        document.getElementById("loading").style.display = "none";
        document.getElementById("dashboard-section").style.display = "block";
        
        const sel = document.getElementById("class-select");
        Array.from(classesList).sort().forEach(cls => {
            let opt = document.createElement("option");
            opt.value = cls;
            opt.text = cls;
            sel.appendChild(opt);
        });
    }

    function loadClassData() {
        const selectedClass = document.getElementById("class-select").value;
        const container = document.getElementById("students-container");
        const overviewContainer = document.getElementById("overview-table-container");
        container.innerHTML = "";
        overviewContainer.innerHTML = "";
        
        if (!selectedClass) {
            document.getElementById("overview-card").style.display = "none";
            document.getElementById("print-controls").style.display = "none";
            return;
        }

        document.getElementById("overview-card").style.display = "block";
        document.getElementById("print-controls").style.display = "flex";

        let classData = allData.filter(row => row[3] && row[3].trim() === selectedClass);
        if (classData.length === 0) return;

        let level = classData[0][classData[0].length - 1];
        let map = level === 'atas' ? mapUpper : mapLower;

        // Build Overview Table
        let table = "<table><thead><tr><th>Bil</th><th>Nama Pelajar</th>";
        map.subjects.forEach(sub => {
            table += `<th>${sub.abbr}</th>`;
        });
        table += "<th>JUM</th><th>PURATA</th><th>GP</th><th>KDK</th><th>KDT</th><th>KEPUTUSAN</th></tr></thead><tbody>";

        classData.forEach((row, idx) => {
            const nama = row[2] || "-";
            const kdtTotal = level === 'atas' ? "253" : "253"; // Example static, or dynamic if computed
            
            table += `<tr><td>${idx+1}</td><td style="text-align:left;">${nama}</td>`;
            map.subjects.forEach(sub => {
                let m = row[sub.m] ? row[sub.m].trim() : "";
                let g = row[sub.g] ? row[sub.g].trim() : "";
                if(m.toUpperCase()==='NULL' || m === '') { m = '-'; g = ''; }
                table += `<td>${m} ${g}</td>`;
            });
            table += `<td>${row[map.jum]||'-'}</td><td>${row[map.purata]||'-'}</td><td>${row[map.gp]||'-'}</td>
                      <td>${row[map.kdk]||'-'}</td><td>${row[map.kdt]||'-'}/${kdtTotal}</td><td>${row[map.keputusan]||'-'}</td></tr>`;
            
            // Build Individual Slips
            let slipHTML = `
            <div class="student-card">
                <img src="https://i.ibb.co/9mL8CNMW/header-SLIP-KEPUTUSAN-PEPERIKSAAN.png" class="slip-header-img" alt="Header">
                <div class="student-header">
                    <div><strong>NAMA:</strong> ${nama}</div>
                    <div><strong>KELAS:</strong> ${selectedClass}</div>
                </div>
                <div style="padding:20px;">
                    <table style="margin-top:0;">
                        <thead><tr><th style="width:60%;">MATA PELAJARAN</th><th>MARKAH</th><th>GRED</th></tr></thead>
                        <tbody>`;
            
            map.subjects.forEach(sub => {
                let m = row[sub.m] ? row[sub.m].trim() : "";
                let g = row[sub.g] ? row[sub.g].trim() : "";
                if (m && m.toUpperCase() !== 'NULL' && m !== '') {
                    slipHTML += `<tr><td style="text-align:left;">${sub.name}</td><td>${m}</td><td>${g}</td></tr>`;
                }
            });

            slipHTML += `</tbody></table>
                <div style="margin-top:20px;">
                    <strong>Jumlah Markah:</strong> ${row[map.jum]||'-'} &nbsp;&nbsp;|&nbsp;&nbsp;
                    <strong>Purata:</strong> ${row[map.purata]||'-'} &nbsp;&nbsp;|&nbsp;&nbsp;
                    <strong>Gred Purata (GP):</strong> ${row[map.gp]||'-'}
                </div>
                <div style="margin-top:10px;">
                    <strong>Kedudukan Dalam Kelas:</strong> ${row[map.kdk]||'-'} &nbsp;&nbsp;|&nbsp;&nbsp;
                    <strong>Kedudukan Dalam Tingkatan:</strong> ${row[map.kdt]||'-'}/${kdtTotal}
                </div>
                <div style="margin-top:10px;">
                    <strong>Keputusan:</strong> ${row[map.keputusan]||'-'} <br>
                    <strong>Analisis:</strong> ${row[map.analisis]||'-'} <br>
                    <strong>Ulasan Guru:</strong> ${row[map.ulasan]||'-'}
                </div>
                
                <div class="signatures">
                    <div class="sig-block">
                        <div class="sig-line">AWIN ANAK ENGGA<br>PENGETUA<br>SMK SELIRIK</div>
                    </div>
                    <div class="sig-block">
                        <div class="sig-line">${row[map.guru]||'GURU TINGKATAN'}<br>GURU TINGKATAN ${selectedClass}<br>SMK SELIRIK</div>
                    </div>
                </div>
            </div></div>`;
            container.innerHTML += slipHTML;
        });

        table += "</tbody></table>";
        overviewContainer.innerHTML = table;
    }

    function printOverview() {
        document.body.className = "print-overview";
        window.print();
        document.body.className = "";
    }

    function printSlips() {
        document.body.className = "print-individual";
        window.print();
        document.body.className = "";
    }
</script>
</body>
</html>
